<style>
/* Values here are not invented — they are the live hero's own computed styles
   at 1920x1080, measured off the page, so the closing frame lands on it:
   copy column at x=364 y=232 w=592, kicker 12px/1.68px tracking, h1 60px/60px
   with -2.28px tracking, lede 19px/29.45px, buttons 16px. Measure with the
   real faces loaded — Inter Tight is narrower than the Arial fallback, and a
   fallback render gives different numbers. Re-measure after any hero change. */
:root{
  --ink:#0B0B0C; --fg:#F4F3F1; --fg-mute:rgba(244,243,241,.58);
  --acid:#CCFF2E; --line:rgba(255,255,255,.11);
  --sans:"Inter Tight",-apple-system,Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;font-synthesis-weight:none}

#stage{position:relative;width:1920px;height:1080px;background:var(--ink);overflow:hidden}

/* the page's own ambient lime wash, sitting over the right column where the
   hero's 3D stage lives, so the cut to the page has something to hand over to */
#bloom{
  position:absolute;top:-6%;left:56%;transform:translateX(-50%);
  width:1500px;aspect-ratio:1;pointer-events:none;
  background:radial-gradient(circle, rgba(204,255,46,.12), transparent 62%);
}
#netFar,#netNear{position:absolute;inset:0;width:1920px;height:1080px}
#netNear{filter:blur(1.1px)}

/* the copy column, pinned where the live hero puts it */
#copy{position:absolute;left:364px;top:232px;width:592px}

#kicker{
  font-family:var(--mono);font-size:12px;letter-spacing:1.68px;line-height:18.6px;
  text-transform:uppercase;color:var(--fg-mute);
}
h1{
  margin-top:22px;
  font-size:60px;line-height:60px;letter-spacing:-2.28px;font-weight:700;color:var(--fg);
}
h1 .line{display:block;overflow:hidden;padding-bottom:.09em;margin-bottom:-.09em}
h1 .line>span{display:block;will-change:transform,opacity}
h1 em,h1 .join{
  font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.6px;
}
h1 em{color:var(--acid)}          /* "Grow" */
h1 .join{color:var(--fg-mute)}    /* "with", "&" */
h1 .dot{color:var(--acid)}

#lede{margin-top:26px;max-width:486px;color:var(--fg-mute);font-size:19px;line-height:29.45px}

#cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px}
.btn{
  position:relative;display:inline-flex;align-items:center;gap:10px;
  padding:17px 30px;border-radius:99px;font-weight:600;font-size:16px;letter-spacing:-.16px;
  overflow:hidden;white-space:nowrap;
}
.btn--solid{background:var(--acid);color:var(--ink)}
.btn--line{border:1px solid var(--line);color:var(--fg)}
/* the light sweep — one highlight band crossing the primary, driven by --sweep */
.btn--solid::after{
  content:"";position:absolute;top:0;bottom:0;width:44%;
  left:calc(var(--sweep, -60) * 1%);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.72),transparent);
  pointer-events:none;
}
</style>

<div id="stage">
  <div id="bloom"></div>
  <canvas id="netFar" width="1920" height="1080"></canvas>

  <div id="copy">
    <p id="kicker">Karachi · Lahore · Islamabad — working across Pakistan</p>
    <h1>
      <span class="line"><span>Helping Pakistani</span></span>
      <span class="line"><span>Businesses <em>Grow</em></span></span>
      <span class="line"><span><i class="join">with</i> Websites, AI&nbsp;Agents</span></span>
      <span class="line"><span><i class="join">&amp;</i> Motion Videos<span class="dot">.</span></span></span>
    </h1>
    <p id="lede">Strategy, design and automation built to help your business look better, respond faster and sell more.</p>
    <div id="cta">
      <span class="btn btn--solid">Book a Free Consultation <span>&rarr;</span></span>
      <span class="btn btn--line">Explore What's Possible <span>&darr;</span></span>
    </div>
  </div>

  <canvas id="netNear" width="1920" height="1080"></canvas>
</div>

<script>
/* ============================================================
   Deterministic hero sequence. Every visual is a pure function of
   t (seconds) — nothing reads the clock — so the capture harness can
   seek to any frame and get an identical image on every run.
   ============================================================ */
const W = 1920, H = 1080, DUR = 18;

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIO  = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const seg = (t, a, b, f) => (f || easeOut)(ramp(t, a, b));

/* fixed seed, so the network is identical on every render */
let _s = 0x2F6E2B1;
const rnd = () => { _s ^= _s << 13; _s ^= _s >>> 17; _s ^= _s << 5; return ((_s >>> 0) % 100000) / 100000; };

/* ── the network ────────────────────────────────────────────
   Nodes hold a world-space x/y/z and are projected through a real
   perspective divide against a camera that dollies forward, so near
   nodes sweep outward while far ones barely move. The parallax falls
   out of the projection rather than being faked per layer. */
const FOCAL = 900;
const NODES = [];
for (let i = 0; i < 320; i++) {
  /* biased right of centre, toward the column the page's 3D stage
     occupies, so the frame stays weighted the way the hero is */
  const rx = (rnd() - .40) * 3600;
  NODES.push({
    x: rx, y: (rnd() - .5) * 2100, z: 140 + rnd() * 2600,
    ax: rnd() * Math.PI * 2, ay: rnd() * Math.PI * 2,
    sp: .18 + rnd() * .30, amp: 9 + rnd() * 20,
    /* three clusters, lit in turn as each service line lands */
    grp: i % 7 === 0 ? (i % 21 === 0 ? 0 : i % 14 === 0 ? 1 : 2) : -1
  });
}

const EDGES = [];
for (let i = 0; i < NODES.length; i++) {
  for (let j = i + 1; j < NODES.length; j++) {
    const a = NODES[i], b = NODES[j];
    const d = Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * .55);
    if (d < 470) EDGES.push({ i, j, ph: rnd() });
  }
}
const PULSES = [];
for (let k = 0; k < 14; k++) {
  PULSES.push({ e: Math.floor(rnd() * EDGES.length), off: rnd(), sp: .10 + rnd() * .12 });
}

/* slow push that decelerates into the hold, so the last seconds are
   almost still and the composition reads */
const camZ = t => -60 + 620 * easeIO(ramp(t, 0, 14.2)) + 26 * ramp(t, 14.2, DUR);

function project(n, t, cz) {
  const x = n.x + Math.sin(n.ax + t * n.sp) * n.amp;
  const y = n.y + Math.cos(n.ay + t * n.sp * .8) * n.amp;
  const z = n.z - cz;
  if (z < 26) return null;
  const k = FOCAL / z;
  return { sx: W / 2 + x * k, sy: H / 2 + y * k, z };
}

/* the services are set in white on this hero, so the lime lands in the
   network instead: each cluster lights as its service line arrives */
const groupLit = t => [seg(t, 6.4, 8.0), seg(t, 7.9, 9.5), seg(t, 9.4, 11.0)];

function drawNet(ctx, t, nearField) {
  ctx.clearRect(0, 0, W, H);
  const cz = camZ(t), lit = groupLit(t);
  const build  = seg(t, 0.5, 6.0);
  const settle = 1 - .22 * seg(t, 11.4, 14.6);
  const P = NODES.map(n => project(n, t, cz));

  for (const E of EDGES) {
    const A = P[E.i], B = P[E.j];
    if (!A || !B) continue;
    if (((A.z + B.z) / 2 < 620) !== nearField) continue;
    const on = clamp01((build - E.ph * .82) * 3.4);
    if (on <= 0) continue;
    const depth = clamp01(1 - (A.z + B.z) / 2 / 2700);
    const g = NODES[E.i].grp;
    const glow = g >= 0 && g === NODES[E.j].grp ? lit[g] : 0;
    let a = (nearField ? .070 : .165) * depth * on * settle + glow * .30 * depth;
    if (a < .004) continue;
    ctx.strokeStyle = glow > .02
      ? `rgba(204,255,46,${a.toFixed(4)})`
      : `rgba(196,214,168,${(a * .62).toFixed(4)})`;
    ctx.lineWidth = Math.max(.45, .95 * depth);
    ctx.beginPath(); ctx.moveTo(A.sx, A.sy); ctx.lineTo(B.sx, B.sy); ctx.stroke();
  }

  for (let i = 0; i < NODES.length; i++) {
    const A = P[i]; if (!A) continue;
    if ((A.z < 620) !== nearField) continue;
    const depth = clamp01(1 - A.z / 2700);
    const g = NODES[i].grp, glow = g >= 0 ? lit[g] : 0;
    const a = (nearField ? .21 : .40) * depth * build * settle + glow * .55 * depth;
    if (a < .006) continue;
    const r = Math.max(.6, (nearField ? 2.1 : 1.5) * depth * (1 + glow * .9));
    ctx.fillStyle = glow > .02
      ? `rgba(204,255,46,${Math.min(1, a).toFixed(4)})`
      : `rgba(214,226,196,${a.toFixed(4)})`;
    ctx.beginPath(); ctx.arc(A.sx, A.sy, r, 0, 6.2832); ctx.fill();
  }

  if (!nearField) {
    const pulseOn = seg(t, 6.2, 8.6);
    for (const p of PULSES) {
      const E = EDGES[p.e], A = P[E.i], B = P[E.j];
      if (!A || !B) continue;
      const u = (p.off + t * p.sp) % 1;
      const x = A.sx + (B.sx - A.sx) * u, y = A.sy + (B.sy - A.sy) * u;
      const depth = clamp01(1 - (A.z + B.z) / 2 / 2700);
      const a = .5 * depth * pulseOn * settle;
      if (a < .01) continue;
      const rr = 15 * depth + 4;
      const grd = ctx.createRadialGradient(x, y, 0, x, y, rr);
      grd.addColorStop(0, `rgba(204,255,46,${a.toFixed(3)})`);
      grd.addColorStop(1, 'rgba(204,255,46,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.2832); ctx.fill();
    }
  }
}

/* ── copy timeline ──────────────────────────────────────────
   Each headline block rises out of its own clip box — the same reveal
   the live page uses — so the motion is the site's, not a new idiom. */
const LINES = [...document.querySelectorAll('h1 .line > span')];
const LINE_IN = [3.1, 4.4, 5.7, 9.4];
const grow = document.querySelector('h1 em');
const joins = [...document.querySelectorAll('h1 .join')];

function drawCopy(t) {
  document.getElementById('kicker').style.opacity = seg(t, 2.2, 3.3).toFixed(3);

  LINES.forEach((el, i) => {
    const p = seg(t, LINE_IN[i], LINE_IN[i] + 1.4);
    el.style.transform = `translateY(${((1 - p) * 118).toFixed(2)}%)`;
    el.style.opacity = (0.10 + 0.90 * p).toFixed(3);
  });

  /* "Grow" is the hero's one lime word, so it gets its own arrival */
  const gp = seg(t, 5.0, 6.2);
  const cool = 1 - seg(t, 12.6, 16.2);
  grow.style.textShadow = `0 0 ${(30 * gp * cool).toFixed(1)}px rgba(204,255,46,${(.38 * gp * cool).toFixed(3)})`;
  joins[0].style.opacity = seg(t, 5.7, 6.6).toFixed(3);
  joins[1].style.opacity = seg(t, 9.4, 10.2).toFixed(3);
  document.querySelector('.dot').style.opacity = seg(t, 10.4, 11.2).toFixed(3);

  const lp = seg(t, 11.0, 12.3);
  const lede = document.getElementById('lede');
  lede.style.opacity = lp.toFixed(3);
  lede.style.transform = `translateY(${((1 - lp) * 12).toFixed(2)}px)`;

  const cp = seg(t, 12.4, 13.7);
  const cta = document.getElementById('cta');
  cta.style.opacity = cp.toFixed(3);
  cta.style.transform = `translateY(${((1 - cp) * 16).toFixed(2)}px)`;
  const solid = cta.querySelector('.btn--solid');
  solid.style.setProperty('--sweep', (-60 + 220 * easeIO(ramp(t, 13.4, 14.8))).toFixed(1));
  /* the glow is an arrival, not a resting state — it decays to the flat
     lime the live button actually sits at, so the cut is invisible */
  const btnCool = 1 - .84 * seg(t, 15.0, 17.0);
  solid.style.boxShadow = `0 0 ${(46 * cp * btnCool).toFixed(0)}px rgba(204,255,46,${(.30 * cp * btnCool).toFixed(3)})`;

  /* the copy column carries a hair of the camera's push — far less than
     the network, so the words never distort or drift out of position */
  const push = easeIO(ramp(t, 0, 14.2));
  document.getElementById('copy').style.transform =
    `translateX(${(-10 * (1 - push)).toFixed(2)}px) scale(${(0.982 + 0.018 * push).toFixed(4)})`;

  document.getElementById('bloom').style.opacity =
    (0.25 + 0.75 * seg(t, 5.5, 12.0) - 0.30 * seg(t, 13.5, 17.0)).toFixed(3);
  document.getElementById('stage').style.filter =
    `brightness(${(0.16 + 0.84 * seg(t, 0.15, 2.4)).toFixed(3)})`;
}

const fFar = document.getElementById('netFar').getContext('2d');
const fNear = document.getElementById('netNear').getContext('2d');

window.__render = t => { drawNet(fFar, t, false); drawNet(fNear, t, true); drawCopy(t); };
window.__seek = (frame, fps) => { window.__render(frame / fps); return true; };
window.__DUR = DUR;
window.__render(0);
</script>
