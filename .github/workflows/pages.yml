# Publishes the site to GitHub Pages.
#
# The site is static — index.html plus assets/ — so the whole repository root
# is uploaded as-is; there is nothing to build. `configure-pages` turns Pages
# on the first time this runs, so no setting has to be flipped by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ai-support-website-design-tzbv57]
  workflow_dispatch:

# Read the repo, mint the Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling, so the live
# site is never left mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The six template photographs are gitignored; fetch them so the website
      # previews ship with real imagery. A failure here is not fatal — the
      # templates fall back to their CSS gradients.
      - name: Fetch template photography
        run: bash assets/img/fetch.sh || echo "photos unavailable — using gradient fallbacks"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
